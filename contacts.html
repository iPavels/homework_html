<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин — Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { width: 240px; min-height: 100vh; background-color: #212529; color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; }
        .sidebar-brand { padding: 1rem 1.25rem; font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid #343a40; }
        .sidebar-nav { flex: 1; padding: 0.5rem 0; }
        .sidebar-nav .nav-link { color: #adb5bd; padding: 0.6rem 1.25rem; display: flex; align-items: center; gap: 0.6rem; transition: background 0.15s; }
        .sidebar-nav .nav-link:hover { background-color: #2c3136; color: #fff; }
        .sidebar-nav .nav-link.active { background-color: #0d6efd; color: #fff; }
        .sidebar-footer { border-top: 1px solid #343a40; padding: 0.5rem 0; }
        .sidebar-footer .dropdown-toggle { color: #adb5bd; padding: 0.6rem 1.25rem; display: flex; align-items: center; gap: 0.6rem; width: 100%; background: none; border: none; text-align: left; }
        .sidebar-footer .dropdown-toggle:hover { color: #fff; }
        .main-content { margin-left: 240px; padding: 2rem; min-height: 100vh; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="bi bi-bootstrap-fill text-primary"></i> Меню</div>
    <nav class="sidebar-nav">
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="catalog.html"><i class="bi bi-grid"></i> Категории</a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-list-check"></i> Заказы</a></li>
            <li class="nav-item"><a class="nav-link active" href="contacts.html"><i class="bi bi-person-lines-fill"></i> Контакты</a></li>
        </ul>
    </nav>
    <div class="sidebar-footer">
        <div class="dropdown dropup">
            <button class="dropdown-toggle" data-bs-toggle="dropdown">
                <img src="https://i.pravatar.cc/28" class="rounded-circle" width="28" height="28" alt="avatar">
                Пользователь
            </button>
            <ul class="dropdown-menu mb-1">
                <li><a class="dropdown-item" href="#">Профиль</a></li>
                <li><a class="dropdown-item" href="#">Выход</a></li>
            </ul>
        </div>
    </div>
</div>

<div class="main-content">
    <h1 class="text-center mb-4">Контакты</h1>
    <div class="row g-4">

        <div class="col-md-6">
            <div class="card p-3">
                <div class="card-body">
                    <form action="/contacts" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Почта</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="@">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Сообщение</label>
                            <textarea class="form-control" id="message" name="message" rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Отправить</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <h5 class="fw-bold">Наши контакты</h5>
            <p class="text-muted">Скоро добавим информацию</p>
            <p class="text-muted">Здесь тоже что то добавим.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
